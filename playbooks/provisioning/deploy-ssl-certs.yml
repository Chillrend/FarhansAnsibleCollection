---
- name: Deploy SSL to Linux Target Servers
  hosts: "{{ target_server }}"
  become: yes
  gather_facts: false
  vars:
    ssl_cert_dir: "/etc/ssl/certs"
    ssl_key_dir: "/etc/ssl/private"
    cert_base_name: "pnj.ac.id"
    # Mapping the full suite from the Docker volume inside Semaphore
    local_cert_path: "/certs/{{ cert_base_name }}.crt"
    local_intermediate_path: "/certs/{{ cert_base_name }}-intermediate.crt"
    local_fullchain_path: "/certs/{{ cert_base_name }}-fullchain.crt"
    local_key_path: "/certs/{{ cert_base_name }}.key"

  tasks:
    - name: Detect ssl-cert group existence
      ansible.builtin.command: getent group ssl-cert
      register: ssl_cert_group_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Set SSL key group
      ansible.builtin.set_fact:
        ssl_key_group: "{{ 'ssl-cert' if ssl_cert_group_check.rc == 0 else 'root' }}"

    - name: Ensure certificate and key directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ ssl_cert_dir }}", group: "root", mode: "0755" }
        - { path: "{{ ssl_key_dir }}", group: "{{ ssl_key_group }}", mode: "0710" }

    - name: Deploy Standard Certificate
      ansible.builtin.copy:
        src: "{{ local_cert_path }}"
        dest: "{{ ssl_cert_dir }}/{{ cert_base_name }}.crt"
        owner: root
        group: root
        mode: '0644'

    - name: Deploy Intermediate Certificate (CA Chain)
      ansible.builtin.copy:
        src: "{{ local_intermediate_path }}"
        dest: "{{ ssl_cert_dir }}/{{ cert_base_name }}-intermediate.crt"
        owner: root
        group: root
        mode: '0644'

    - name: Deploy Fullchain Certificate
      ansible.builtin.copy:
        src: "{{ local_fullchain_path }}"
        dest: "{{ ssl_cert_dir }}/{{ cert_base_name }}-fullchain.crt"
        owner: root
        group: root
        mode: '0644'

    - name: Deploy Private Key
      ansible.builtin.copy:
        src: "{{ local_key_path }}"
        dest: "{{ ssl_key_dir }}/{{ cert_base_name }}.key"
        owner: root
        group: "{{ ssl_key_group }}"
        mode: '0640'
