---
# ==============================================================================
# PLAY 1: PRE-FLIGHT VALIDATION (Runs on validator_server)
# ==============================================================================
- name: Validate Certificates Before Deployment
  hosts: "{{ validator_server }}"
  become: no  
  gather_facts: false
  vars:
    cert_base_name: "pnj.ac.id"
    local_cert_path: "/certs/{{ cert_base_name }}.crt"
    local_key_path: "/certs/{{ cert_base_name }}.key"
    # Changed to a static directory to prevent mid-play evaluation changes
    remote_tmp_dir: "/tmp/ssl_validation_workspace"

  tasks:
    - name: Create temporary validation directory
      ansible.builtin.file:
        path: "{{ remote_tmp_dir }}"
        state: directory
        mode: '0700'

    - name: Validation Block
      block:
        - name: Copy certificate for validation
          ansible.builtin.copy:
            src: "{{ local_cert_path }}"
            dest: "{{ remote_tmp_dir }}/{{ cert_base_name }}.crt"
            mode: '0600'

        - name: Copy private key for validation
          ansible.builtin.copy:
            src: "{{ local_key_path }}"
            dest: "{{ remote_tmp_dir }}/{{ cert_base_name }}.key"
            mode: '0600'

        - name: Get Certificate Modulus
          ansible.builtin.command: "openssl x509 -noout -modulus -in {{ remote_tmp_dir }}/{{ cert_base_name }}.crt"
          register: cert_modulus
          changed_when: false

        - name: Get Private Key Modulus
          ansible.builtin.command: "openssl rsa -noout -modulus -in {{ remote_tmp_dir }}/{{ cert_base_name }}.key"
          register: key_modulus
          changed_when: false

        - name: Assert Certificate and Key Match
          ansible.builtin.assert:
            that:
              - cert_modulus.stdout == key_modulus.stdout
            fail_msg: "CRITICAL: The certificate and private key in Semaphore's /certs volume do not match! Deployment aborted."
            success_msg: "Validation passed: Certificate and private key match perfectly."

      always:
        - name: Cleanup temporary validation directory
          ansible.builtin.file:
            path: "{{ remote_tmp_dir }}"
            state: absent
            
# ==============================================================================
# PLAY 2: DEPLOY TO LINUX TARGET SERVERS (Runs on target_server)
# ==============================================================================
- name: Deploy SSL to Linux Target Servers
  hosts: "{{ target_server }}"
  become: yes
  gather_facts: false
  vars:
    ssl_cert_dir: "/etc/ssl/certs"
    ssl_key_dir: "/etc/ssl/private"
    cert_base_name: "pnj.ac.id"
    # Mapping the full suite from the Docker volume inside Semaphore
    local_cert_path: "/certs/{{ cert_base_name }}.crt"
    local_intermediate_path: "/certs/{{ cert_base_name }}-intermediate.crt"
    local_fullchain_path: "/certs/{{ cert_base_name }}-fullchain.crt"
    local_key_path: "/certs/{{ cert_base_name }}.key"

  tasks:
    - name: Detect ssl-cert group existence
      ansible.builtin.command: getent group ssl-cert
      register: ssl_cert_group_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Set SSL key group
      ansible.builtin.set_fact:
        ssl_key_group: "{{ 'ssl-cert' if ssl_cert_group_check.rc == 0 else 'root' }}"

    - name: Ensure certificate and key directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ ssl_cert_dir }}", group: "root", mode: "0755" }
        - { path: "{{ ssl_key_dir }}", group: "{{ ssl_key_group }}", mode: "0710" }

    - name: Deploy Standard Certificate
      ansible.builtin.copy:
        src: "{{ local_cert_path }}"
        dest: "{{ ssl_cert_dir }}/{{ cert_base_name }}.crt"
        owner: root
        group: root
        mode: '0644'

    - name: Deploy Intermediate Certificate (CA Chain)
      ansible.builtin.copy:
        src: "{{ local_intermediate_path }}"
        dest: "{{ ssl_cert_dir }}/{{ cert_base_name }}-intermediate.crt"
        owner: root
        group: root
        mode: '0644'

    - name: Deploy Fullchain Certificate
      ansible.builtin.copy:
        src: "{{ local_fullchain_path }}"
        dest: "{{ ssl_cert_dir }}/{{ cert_base_name }}-fullchain.crt"
        owner: root
        group: root
        mode: '0644'

    - name: Deploy Private Key
      ansible.builtin.copy:
        src: "{{ local_key_path }}"
        dest: "{{ ssl_key_dir }}/{{ cert_base_name }}.key"
        owner: root
        group: "{{ ssl_key_group }}"
        mode: '0640'
