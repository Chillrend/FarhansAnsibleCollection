---
- name: Benchmark and Label RKE Cluster Nodes
  hosts: rke_cluster
  become: yes
  gather_facts: no
  vars:
    # 10G Server IP
    iperf_server: 10.152.0.114
    
    # Thresholds
    cpu_low: 3000
    cpu_high: 8000
    disk_hdd: 1000
    disk_nvme: 10000
    net_1g: 1500

  tasks:
    - name: Ensure benchmark tools are installed
      apt:
        name:
          - curl
          - iperf3
          - jq
          - sysbench
          - fio
        state: present
        update_cache: yes

    - name: Run Sysbench Multi-Core CPU Benchmark
      shell: "sysbench cpu --threads=$(nproc) --time=10 run | awk '/events per second:/ {print $4}'"
      register: sysbench_output

    - name: Run fio Disk Benchmark
      command: >
        fio --name=bench
        --ioengine=libaio
        --rw=randread
        --bs=4k
        --iodepth=16
        --runtime=10
        --time_based
        --filename=/tmp/fio_bench.tmp
        --size=256M
        --direct=1
        --output-format=json
      register: fio_output

    - name: Clean up fio benchmark file
      file:
        path: /tmp/fio_bench.tmp
        state: absent

    - name: Parse fio JSON
      set_fact:
        fio_data: "{{ fio_output.stdout | from_json }}"

    - name: Run iperf3 Network Test
      command: "iperf3 -c {{ iperf_server }} -J"
      register: iperf_output
      ignore_errors: yes # Don't fail the whole playbook if the iperf server hiccups

    - name: Parse iperf3 JSON
      set_fact:
        iperf_data: "{{ iperf_output.stdout | from_json }}"
      when: iperf_output.rc == 0

    - name: Determine Categories
      set_fact:
        perf_cpu: "{{ 'low' if ((sysbench_output.stdout | default(0) | float) < cpu_low) else ('high' if ((sysbench_output.stdout | default(0) | float) > cpu_high) else 'medium') }}"
        perf_disk: "{{ 'hdd' if ((fio_data.jobs[0].read.iops | default(0) | float) < disk_hdd) else ('nvme' if ((fio_data.jobs[0].read.iops | default(0) | float) > disk_nvme) else 'ssd') }}"
        perf_net: "{{ ('10g' if ((iperf_data.end.sum_received.bits_per_second | default(0)) / 1000000 > net_1g) else '1g') if (iperf_output.rc == 0) else 'unknown' }}"

    - name: Display Benchmark Results
      debug:
        msg:
          - "CPU  : {{ sysbench_output.stdout | default('0') | trim }} events/sec -> perf/cpu={{ perf_cpu }}"
          - "Disk : {{ (fio_data.jobs[0].read.iops | default(0)) | round(1) }} IOPS -> perf/disk={{ perf_disk }}"
          - "Net  : {{ ((iperf_data.end.sum_received.bits_per_second | default(0)) / 1000000) | round(1) if iperf_output.rc == 0 else 'N/A' }} Mbps -> perf/net={{ perf_net }}"

    - name: Label Kubernetes Node
      command: >
        kubectl label node {{ inventory_hostname }}
        perf/cpu={{ perf_cpu | trim }}
        perf/disk={{ perf_disk | trim }}
        perf/net={{ perf_net | trim }}
        {% if node_taint is defined and node_taint != '' %}
        status/stability={{ node_taint | trim }}
        {% endif %}
        --overwrite
      delegate_to: ansible-upatik
      become: no # Ensure we run as the 'ansible' user which has the kubeconfig
