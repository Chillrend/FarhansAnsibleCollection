---
- name: Benchmark and Label RKE Cluster Nodes
  hosts: rke_cluster
  become: yes
  gather_facts: no
  vars:
    # 10G Server IP
    iperf_server: 10.152.0.114
    
    # Thresholds
    cpu_low: 3000
    cpu_high: 8000
    disk_hdd: 1000
    disk_nvme: 10000
    net_1g: 1500

  tasks:
    - name: Ensure benchmark tools are installed
      apt:
        name:
          - curl
          - iperf3
          - jq
        state: present
        update_cache: yes

    - name: Download YABS script
      get_url:
        url: https://raw.githubusercontent.com/masonr/yet-another-bench-script/master/yabs.sh
        dest: /tmp/yabs.sh
        mode: '0755'

    - name: Run YABS (CPU & Disk)
      # YABS writes a lot of \r progress bars to stderr, which can fill up Ansible's async buffers and hang.
      # Downloading it first, passing < /dev/null to prevent input hanging, and redirecting stderr to /dev/null fixes this.
      shell: "/tmp/yabs.sh -i -j < /dev/null > /tmp/yabs.json 2>/dev/null"
      async: 2400
      poll: 60

    - name: Parse YABS JSON
      shell: "cat /tmp/yabs.json | grep -o '{.*}'"
      register: yabs_clean_output

    - name: Set YABS Fact
      set_fact:
        yabs_data: "{{ yabs_clean_output.stdout | from_json }}"

    - name: Run iperf3 Network Test
      command: "iperf3 -c {{ iperf_server }} -J"
      register: iperf_output
      ignore_errors: yes # Don't fail the whole playbook if the iperf server hiccups

    - name: Parse iperf3 JSON
      set_fact:
        iperf_data: "{{ iperf_output.stdout | from_json }}"
      when: iperf_output.rc == 0

    - name: Determine Categories
      set_fact:
        perf_cpu: >-
          {% set mc = yabs_data.geekbench[0].multi | default(0) | int %}
          {% if mc < cpu_low %}low{% elif mc > cpu_high %}high{% else %}medium{% endif %}
        perf_disk: >-
          {% set iops = yabs_data.fio[0].iops_r | default(0) | int %}
          {% if iops < disk_hdd %}hdd{% elif iops > disk_nvme %}nvme{% else %}ssd{% endif %}
        perf_net: >-
          {% if iperf_output.rc == 0 %}
            {% set mbps = (iperf_data.end.sum_received.bits_per_second / 1000000) | int %}
            {% if mbps > net_1g %}10g{% else %}1g{% endif %}
          {% else %}
            unknown
          {% endif %}

    - name: Label Kubernetes Node
      command: >
        kubectl label node {{ inventory_hostname }}
        perf/cpu={{ perf_cpu }}
        perf/disk={{ perf_disk }}
        perf/net={{ perf_net }}
        {% if node_taint is defined and node_taint != '' %}
        status/stability={{ node_taint }}
        {% endif %}
        --overwrite
      delegate_to: ansible-upatik
      become: no # Ensure we run as the 'ansible' user which has the kubeconfig
